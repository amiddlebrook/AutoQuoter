name: Cloudflare CI and deployment

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate quote engine and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: npm run check
      - name: Unit and API tests
        run: npm test
      - name: Validate static assets
        run: |
          test -s frontend/index.html
          test -s frontend/app.js
          test -s frontend/styles.css
          ! grep -RE 'http://localhost:5000|127[.]0[.]0[.]1:5000' frontend/index.html frontend/app.js

  deploy:
    name: Publish to Cloudflare Workers
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
      - name: Smoke test live Workers deployment
        env:
          BASE_URL: https://autoquoter.averymiddlebrook2014.workers.dev
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$BASE_URL/api/health" \
            | jq -e '.status == "ok" and .engine == "cloudflare-worker"'
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$BASE_URL/api/catalog" \
            | jq -e '.catalog.hvac.presets.heatpump.label != null and (.states | length) == 51'
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 \
            -H 'Content-Type: application/json' \
            --data '{"trade":"hvac","task":"heatpump","state":"CO","quantity":1,"complexity":"standard","urgency":"flexible","addedMaterials":0}' \
            "$BASE_URL/api/quote" \
            | jq -e '.trade == "hvac" and .low < .median and .median < .high and .breakdown.materials > 0'
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$BASE_URL/" | grep -q 'Quote studio'
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$BASE_URL/app.js" | grep -q 'function renderResult'
          echo "Live Cloudflare endpoints and frontend passed smoke checks."
