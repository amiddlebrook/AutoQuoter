name: Free browser end-to-end GTM QA
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation without adding paid services
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local Cloudflare Worker and test actual browser workflows
        run: |
          set -euo pipefail
          npx wrangler@4 dev --ip 127.0.0.1 --port 8787 --var LEADS_ADMIN_TOKEN:integration-test-only-0123456789 > /tmp/autoquoter-dev.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health
          node tests/browser-e2e.mjs
