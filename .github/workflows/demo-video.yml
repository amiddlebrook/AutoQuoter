name: Offline narrated demo videos — $0
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/render-demo.mjs"
      - ".github/workflows/demo-video.yml"
permissions:
  contents: write
concurrency:
  group: autoquoter-demo-videos
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free/offline speech and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Record actual frontend calculations using real Worker math, sample data and spoken narration
        run: node scripts/render-demo.mjs
      - name: Assert video, AAC audio, captions and transcript
        run: |
          test -s frontend/videos/autoquoter-full-walkthrough.mp4
          test -s frontend/videos/autoquoter-full-walkthrough.vtt
          test -s frontend/videos/autoquoter-48s-preview.mp4
          test -s frontend/videos/walkthrough-transcript.txt
          ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1 frontend/videos/autoquoter-full-walkthrough.mp4 | grep -q 'aac'
          ffprobe -v error -select_streams v -show_entries stream=codec_name -of default=noprint_wrappers=1 frontend/videos/autoquoter-full-walkthrough.mp4 | grep -q 'h264'
      - uses: actions/upload-artifact@v4
        with:
          name: autoquoter-narrated-walkthrough
          path: frontend/videos/
          retention-days: 7
      - name: Commit finished media for free Cloudflare hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name autoquoter-media-bot
          git config user.email autoquoter-media-bot@users.noreply.github.com
          git add frontend/videos/
          if ! git diff --cached --quiet; then
            git commit -m "media: publish narrated full tutorial with captions and short promo"
            git push origin HEAD:master
          fi
      - name: Deploy newly generated media directly to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 deploy
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null "https://autoquoter.averymiddlebrook2014.workers.dev/videos/autoquoter-full-walkthrough.mp4"
