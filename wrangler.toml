name = "autoquoter"
main = "src/worker.js"
compatibility_date = "2026-10-16"
workers_dev = true

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "LEADS"
class_name = "LeadsInbox"

[exports.LeadsInbox]
type = "durable-object"
storage = "sqlite"
